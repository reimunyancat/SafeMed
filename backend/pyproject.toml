[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safemed-backend"
version = "0.1.0"
description = "SafeMed multi-drug interaction risk service"
readme = "../README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "reimunyancat"}]
license = {text = "MIT"}
dependencies = [
    "fastapi[standard]>=0.115,<0.140",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<0.30",
    "uvicorn[standard]>=0.32,<0.40",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "statsmodels>=0.14,<1.0",
    "networkx>=3.3,<4.0",
    "anyio>=4.4,<5.0",
    "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-httpx>=0.30,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]
ml = [
    # GCN training. Install with `pip install -e ".[ml]"`.
    # Torch + PyG are heavy (>1GB) so they stay out of the runtime image.
    "torch>=2.3,<3.0",
    "torch-geometric>=2.5,<3.0",
    "scikit-learn>=1.5,<2.0",
    "tqdm>=4.66,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
